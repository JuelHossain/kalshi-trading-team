name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r engine/requirements-dev.txt

      # No secrets are needed or provided. tests/engine/conftest.py fills in
      # placeholder credentials for constructors that only check a value is
      # present, blocks outbound HTTP, and skips the tests marked `live`.
      - name: Run tests
        env:
          PYTHONPATH: engine:.
        run: pytest tests/ -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
